[workspace]
members = ["src-tauri", "crates/codly-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "signal", "net", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
