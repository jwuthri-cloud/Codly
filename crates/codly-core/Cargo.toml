[package]
name = "codly-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codly core: agent adapters, orchestrator, store, retrieval. No Tauri dependency."

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
memchr = "2.8"
nix = { version = "0.31", features = ["signal", "process", "user"] }
which = "8.0"
dirs = "7.0"
ignore = "0.4.33"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
portable-pty = "0.9.0"
ts-rs = { version = "12.0", features = ["serde-json-impl", "uuid-impl"] }
globset = "0.4.20"
regex = "1.13"

[dev-dependencies]
tempfile = "3"
